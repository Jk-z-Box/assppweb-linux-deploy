<!doctype html>
<html lang="zh-CN" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <meta name="color-scheme" content="light dark" />
    <title>登录 · Asspp Web</title>
    <link rel="stylesheet" href="/_auth/login.css" />
    <script src="/_auth/login.js" defer></script>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">A</div>
      <div class="brand">ASSPP WEB</div>
      <h1 id="title">欢迎回来</h1>
      <p id="subtitle" class="subtitle">登录你的应用管理空间</p>
      <p id="message" role="alert" hidden></p>
      <form id="login" hidden>
        <label for="username">网站用户名</label>
        <input
          id="username"
          name="username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
          maxlength="64"
          placeholder="输入用户名"
        />
        <label for="password">网站密码</label>
        <div class="password-field">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="输入密码"
          />
          <button id="show-password" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
        </div>
        <label class="remember"><input id="remember" type="checkbox" checked /> 保持登录 7 天</label>
        <button class="primary" id="submit" type="submit">登录</button>
        <p class="hint">使用部署时设置的网站账号。<br />Apple ID 请在进入后添加。</p>
      </form>
      <section id="session" hidden>
        <a class="primary" href="/">进入 Asspp Web <span aria-hidden="true">→</span></a>
        <button id="logout" class="secondary" type="button">退出当前设备</button>
        <button id="logout-all" class="text-button" type="button">退出所有设备</button>
        <p class="hint">退出网站会保留服务端的 Apple ID 账号。</p>
      </section>
      <p id="loading" class="hint">正在检查登录状态…</p>
      <noscript>请启用 JavaScript 后登录。</noscript>
    </main>
    <footer>你的设备，你的应用。</footer>
  </body>
</html>
